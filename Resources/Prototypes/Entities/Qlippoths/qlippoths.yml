#region baseEntities
# BASE QLIPPOTH ENTITIES TO USE AS PARENTS #
# THE Base Qlippoth
# QlippothBase carries ONLY what every Qlippoth shares: a default sprite and the four Qlippoth components.
# Mob plumbing (BaseControllable: MindContainer, Input, Eye, mob physics/fixtures...) is NOT here any more;
# it comes in through QlippothMobBase (via BaseMob) and the Animated / NonConstrained movement bases,
# so item, structure, wall and machine Qlippoths stay clean.
- type: entity
  id: QlippothBase
  name: Qlippoth Base
  abstract: true
  components:
    - type: Sprite
      sprite: Qlippoth/king_in_yellow.rsi # has a default sprite for testing
      layers: # NOTE: instances that override the sprite must also use `layers:` (not `state:`), otherwise this layer stays underneath.
        - state: front
    # Identity. Every Qlippoth has this; instances override what they need.
    #   gatePhases     -> which Q-Gate phases can bring this Qlippoth (several Qlippoths may share a phase; one is picked by spawnWeight)
    #   dungeon        -> how the rift behind the gate is built for this Qlippoth
    #   marketPrice / researchPoints -> what it is worth once secured
    # Passive effects (sanity aura, corruption) are NOT tied to phase: add a ProximityInitiation action (see MobQlippothPhase3/4).
    - type: Qlippoth
      gatePhases: [Phase1Rift]
      spawnWeight: 1
      marketPrice: 500
      researchPoints: 50
      dungeon: !type:ArenaDungeon
        width: 20
        height: 15
        floor: FloorSteel
        wall: WallReinforced
    # Qlippoth Testing Aid
    - type: QlippothPresence
      presenceType: Object # default values, other presences not implemented
      objectSize: Mob      # default value, will be changed for every Qlippoth
    - type: QlippothMovement  # not finished
      movementType: Animated
    - type: QlippothActions
      actions:
        # Inherited by every Qlippoth that does not declare its own `actions:` list.
        # These two exist so a bare base entity can be checked in-game: pull it (sound) and click it (popup).
        - !type:QlippothAction
          actionName: "template"
          initiation: !type:OnPullInitiation
          results:
            - !type:TestSoundResult
              volume: 5
        - !type:QlippothAction
          actionName: "templateClick"     # empty-hand click; proves the entity is interactable at all
          initiation: !type:OnInteractHandInitiation
          cooldown: 1
          results:
            - !type:DebugTraceResult
            - !type:SayActorNameResult
            - !type:TestSoundResult


# Presence and Object Type Parents
- type: entity
  id: QlippothMobBase
  name: Qlippoth Mob Base
  abstract: true
  parent:
  - QlippothBase
  - BaseMob
  - MobDamageable # all mob qlippoths will be damageable and available to combat. if an invincible mob is required, it can be built as a new template: "qlippothAnimatedObjectBase"
  - MobCombat
  components:
    - type: Animateable
    # Qlippoth Specific

- type: entity
  id: QlippothStructureBase
  name: Qlippoth Structure Base
  abstract: true
  parent:
  - QlippothBase
  - BaseStructure
  components:
    # Huge Specific
    - type: Physics
      bodyType: Static
    # could have fixture here.
    # Qlippoth Specific

- type: entity
  id: QlippothWallBase
  name: Qlippoth Wall Base
  abstract: true
  parent:
  - QlippothStructureBase
  components:
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.45,-0.45,0.45,0.45"
          density: 100
          mask:
          - FullTileMask
          layer:
          - WallLayer
    # Qlippoth Specific

- type: entity
  id: QlippothMachineBase
  name: Qlippoth Machine Base
  abstract: true
  parent:
  - QlippothStructureBase
  - BaseStructureComputer
  components:
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.45,-0.45,0.45,0.45"
          density: 100
          mask:
          - MachineMask
          layer:
          - MachineLayer
    # need an activation method, unless every Qlippoth handles it in a different way
    # Qlippoth Specific

- type: entity
  id: QlippothLargeBase
  name: Qlippoth Large Base
  abstract: true
  parent:
  - QlippothBase
  - BaseStructureDynamic
  components:
    # Large Specific
    # What "Large" means: a free-standing object that is too big to pick up but is NOT part of the station grid.
    # It is dynamic (it can be pushed and pulled around), it blocks movement, it can be damaged and examined,
    # and it is clickable: empty-hand click, click-with-item and the context menu all reach the action system
    # (see the "templateClick" action inherited from QlippothBase).
    # Use QlippothStructureBase / QlippothWallBase instead when the Qlippoth should be anchored and immovable.
    - type: Physics
      bodyType: Dynamic
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.25,-0.25,0.25,0.25"
          density: 190
          mask:
          - MachineMask
          layer:
          - MachineLayer
    - type: Pullable
    # Health. BaseStructure gives no health at all, so without these three a Large Qlippoth cannot be hurt:
    # OnDamagedInitiation and OnDestroyedInitiation would never fire and DamageExaminable would show nothing.
    #   Damageable  -> how incoming damage is scaled (resistances)
    #   Injurable   -> which damage types it can take at all (no container = takes nothing)
    #   Destructible -> what counts as "destroyed"; the Destruction act is what raises DestructionEventArgs
    # Instances override the numbers; a tougher Qlippoth just raises the threshold.
    - type: Damageable
      damageModifierSet: Metallic
    - type: Injurable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 200
        behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
    - type: DamageExaminable # idk if it exists in parents but sure
    # Every Large Qlippoth is a Large object; instances no longer need to repeat this.
    - type: QlippothPresence
      presenceType: Object
      objectSize: Large
    # Qlippoth Specific

- type: entity
  id: QlippothItemBase # do not spawn
  name: Qlippoth Item Base
  abstract: true
  parent:
  - QlippothBase
  - BaseItem
  components:
    # Item Specific
    - type: Item
      size: Small
    # Qlippoth Specific

- type: entity
  id: QlippothClothingBase
  name: Qlippoth Clothing Base
  abstract: true
  parent: QlippothItemBase
  components:
  # Clothing Specific
    - type: Clothing
      slots: # needs to be overriden but kept for future references
      # NONE, HEAD, MASK, OUTERCLOTHING, EYES, EARS, HAND, FEET, GLOVES, IDCARD, BELT, BACK, NECK, INNERCLOTHING, POCKET, LEGS, SUITSTORAGE, All, WITHOUT_POCKET
        - HEAD
  # Qlippoth Specific

# Movement Parents
- type: entity
  id: QlippothInanimateBase
  name: Qlippoth Inanimate Base
  abstract: true
  parent:
  - QlippothBase
  components:
    # make sure to remove any movement controls here, or to set speed to 0 for short term inanimate situations
    # density is decided uniquely for qlippoths and is crucial
    - type: Physics
      bodyType: Dynamic
    - type: QlippothMovement
      movementType: Inanimate
    # - type: Pullable Maybe another type can be added for physics in addition to movement? or could just have a guide for certain types.

- type: entity
  id: QlippothStaticBase
  name: Qlippoth Static Base
  abstract: true
  parent:
  - QlippothBase
  components:
  - type: Physics
    bodyType: Static
  - type: QlippothMovement
    movementType: Static
  - type: Transform
    anchored: true

- type: entity
  id: QlippothAnimatedBase
  name: Qlippoth Animated Base
  abstract: true
  parent:
  - QlippothBase
  - BaseControllable # animated = something can drive it (player/ghost role/AI), so it needs the controllable plumbing
  components:
  - type: Physics
    bodyType: KinematicController
  - type: QlippothMovement
    movementType: Animated
  - type: InputMover
  - type: MobMover
  - type: MovementSpeedModifier

- type: entity
  id: QlippothNonConstrainedBase
  name: Qlippoth Non-Constrained Base
  abstract: true
  parent:
  - QlippothBase
  - BaseControllable
  components:
  - type: QlippothMovement
    movementType: NonConstrained
  - type: Physics
    bodyType: KinematicController
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 100
        mask: []
        layer: []
  - type: InputMover
  - type: MobMover
  - type: MovementSpeedModifier
# conditionally animated and specialists are too dependent on c# code so they are for later.
#endregion

#region test entities

# SHOWCASE INSTANCE - RESULT TESTER #
# ============================================================================================
# RULE: EVERY QlippothResult MUST BE ON THIS ENTITY. New Results should be constantly added to this as this is the main testing object for results.
# When you add a new result class to Content.Server/Qlippoth/Actions/QlippothResult.cs, add it to one of the
# verbs below (or to a new verb) in the same change. This idol is the in-game tester for the whole result list.
#
# How it works:
#   - Only VerbInitiation is used. Right-click the idol -> Qlippoth submenu -> pick a verb.
#   - Results are packed several per verb so the menu stays short (100+ single verbs would not fit).
#     The verb text is "[NN] Group: ResultA, ResultB, ..." and lists the results it runs, in order.
#   - Every action has continueOnFailure: true, so one failing result does not hide the ones after it.
#     Each verb starts with DebugTraceResult so you can see it fired.
#   - traceResults: true on the component: after every verb you get ONE purple chat line listing each result:
#       ✓ did its job        ✗ ran but had nothing to do / failed its check        ■ StopResult ended the list
#       💥 the result threw an exception (also in the server log; this is always a bug)
#     Most entries carry a detail in brackets saying exactly what happened or why not, e.g.
#       Ignite ✓ (→ Urist; Urist now 3 stacks, on fire=True) · OpenDoor ✗ (no target: NearestInRange 6 tiles, needs Door)
#     That line is the ground truth: ✓ with a detail = it worked, ✗ = it did not and the bracket says why.
#     The "Expect:" comments below say what you should SEE in the world on top of it.
#   - Right-click the idol -> Qlippoth -> "How do I test these?" whispers you the test order and how to read the line.
#   - "target" of a verb = the player who clicked. Offspring = the mobs the idol spawned in [15].
#   - Verbs marked [!] are disruptive (explosions, round events, mind swap). Use them on a test server.
#   - [19] Undo puts back what the other verbs changed (components, name, anchor, doors, pinpointer, polymorph, fire).
#   - [13] runs the four damage-REACTION results. They edit a damage event that only exists inside
#     OnHolderDamaged / OnMeleeHit / OnAttacked, so from a verb they return ✗ by design. The live demo for one of
#     them is the "thorns" action right after [21]: hit the idol with anything and watch the popup.
# ============================================================================================
- type: entity
  id: ResultShowcaseIdol
  parent: [QlippothLargeBase, SolutionBeaker, SolutionSmall] # solution "beaker" (60u) for the [10] solution results
  name: idol of many mouths
  description: A squat stone figure. Every one of its mouths is slightly open. Admins use it to test every Qlippoth result.
  components:
    - type: Qlippoth
      gatePhases: []   # admin-spawn only
      marketPrice: 1500
      researchPoints: 120
    - type: QlippothMovement
      movementType: Inanimate
    - type: PointLight
      radius: 3
      energy: 1
      color: "#9B30FF"
    # Pinpointer pieces (same as QlippothGazeScepter) so SetPinpointerActive / PointAtNearest have something to drive.
    - type: Sprite
      layers:
        - state: front
          map: ["enum.PinpointerLayers.Base"]
        - sprite: Objects/Devices/pinpointer.rsi
          state: pinonnull
          map: ["enum.PinpointerLayers.Screen"]
          shader: unshaded
          visible: false
    - type: Pinpointer
      canRetarget: false
      reachedDistance: 1.5
      closeDistance: 6
      mediumDistance: 14
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.PinpointerVisuals.IsActive:
          enum.PinpointerLayers.Screen:
            True: { visible: true }
            False: { visible: false }
        enum.PinpointerVisuals.TargetDistance:
          enum.PinpointerLayers.Screen:
            Unknown: { state: pinonnull }
            Reached: { state: pinondirect }
            Close: { state: pinonclose }
            Medium: { state: pinonmedium }
            Far: { state: pinonfar }
    - type: QlippothActions
      traceResults: true
      actions:
        # ---------------- Interface ----------------
        - !type:QlippothAction
          actionName: howToTest           # whispers the tester a cheat sheet; not a result under test
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: howto
            text: "How do I test these? (cheat sheet)"
            priority: 101
          results:
            - !type:WhisperToResult
              message: "READ THE PURPLE LINE after every verb: ✓ = worked, ✗ = ran but nothing happened (the bracket says why: no target, missing component, chance missed), ■ = StopResult ended the list, 💥 = crashed (always a bug, check the server log). Every verb starts with DebugTrace ✓ so you know the click arrived."
            - !type:WhisperToResult
              message: "ORDER: [01]-[12] in any order. [15] Reproduce BEFORE [16] Offspring (it kills what [15] spawned). [14] Components and [17] Polymorph BEFORE [19] Undo. [04] sets you on fire: [19] Undo puts it out. Hit the idol with any weapon for the thorns demo of [13]."
            - !type:WhisperToResult
              message: "NEEDS SETUP: [12] Doors wants an airlock within 6 tiles. [02] PoweredLight wants a wall light within 6 tiles. [17] needs you to stand still 10 s as a carp. [22] needs an unbreached gate on the map. [20]-[23] are marked [!]: they explode, call the shuttle, swap your mind. Test server only."
            - !type:WhisperToResult
              message: "EXPECTED ✗: [13] all four (they only edit a damage event that a verb does not carry). [16] with nothing spawned ('no target: Offspring'). [09] ConvertTiles when every 50% roll missed. [19] on anything that was not changed. Anything else ✗ = read the bracket, then report it."

        # ---------------- [01] Text / chat ----------------
        - !type:QlippothAction
          actionName: test01Text
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test01
            text: "[01] Text: DebugTrace, Popup, Speak, WhisperTo, SayActorName, MindMessage, ForceSay, ForceEmote, Log"
            priority: 100
          # Expect: purple popup over the idol "PopupResult works.", the idol SAYS two lines in local chat, you alone
          # get a whisper, it says your name, a MindMessage appears in your chat, "ForceSayResult made me say this."
          # in local chat, the idol screams (emote), and LogResult only shows in the server log (✓ is all you see).
          results:
            - !type:DebugTraceResult
              message: "DebugTrace worked."
            - !type:PopupResult
              message: "PopupResult works."
              recipient: Everyone
              type: Qlippoth
            - !type:SpeakResult
              messages: ["SpeakResult works.", "I have many mouths."]
            - !type:WhisperToResult
              message: "WhisperToResult works (only you see this)."
            - !type:SayActorNameResult
              format: "SayActorNameResult: {name}"
            - !type:MindMessageResult
              message: "MindMessageResult works."
            - !type:ForceSayResult
              message: "ForceSayResult made me say this."
            - !type:ForceEmoteResult
              emote: Scream
            - !type:LogResult
              message: "LogResult works (server log)."

        # ---------------- [02] Sound / light ----------------
        - !type:QlippothAction
          actionName: test02SoundLight
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test02
            text: "[02] Sound/Light: PlaySound, TestSound, SetLight, ToggleGlow, PoweredLight(toggle)"
            priority: 99
          results:
            - !type:DebugTraceResult
            - !type:PlaySoundResult
              soundPath: /Audio/Qlippoth/qlippoth.ogg
              volume: 3
            - !type:TestSoundResult
            - !type:ToggleGlowResult       # expect: idol lights up orange (forced on, so the first click never turns it off)
              enabled: true
              color: "#FF4500"
              radius: 5
            - !type:SetLightResult         # expect: ...then the glow turns teal and a bit smaller. [19] puts the purple back.
              color: "#00FFAA"
              radius: 4
            - !type:PoweredLightResult     # expect: wall lights within 6 tiles flip; ✗ in the trace if the room has none
              mode: Toggle

        # ---------------- [03] Effects on you ----------------
        - !type:QlippothAction
          actionName: test03Effects
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test03
            text: "[03] Effects on you: Damage, Heal, StaminaDamage, Jitter, Flash, SpeedModifier, StatusEffect, DropHeldItems, Knockdown, Stun"
            priority: 98
          # Order matters: Heal runs BEFORE Damage so the 10 blunt stays on your health bar,
          # and Flash / blindness come LAST so they do not hide the rest. Expect, in this order:
          # health topped up, then -10 blunt, stamina bar drops, held items fall, you drop to the floor (2 s),
          # stunned (2 s), slowed walk for 6 s, shaky sprite 4 s, white flash 1 s, black screen 2 s.
          results:
            - !type:DebugTraceResult
            - !type:HealResult
              healAll: true
            - !type:DamageResult
              damage:
                types:
                  Blunt: 10
            - !type:StaminaDamageResult
              amount: 30
            - !type:DropHeldItemsResult
            - !type:KnockdownResult
              duration: 2
            - !type:StunResult
              duration: 2
            - !type:SpeedModifierResult
              duration: 6
            - !type:JitterResult
              duration: 4
            - !type:FlashResult
              duration: 1
            - !type:StatusEffectResult
              effect: StatusEffectBlindness
              duration: 2

        # ---------------- [04] Hazards on you ----------------
        - !type:QlippothAction
          actionName: test04Hazards
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test04
            text: "[04] Hazards on you: Ignite(3 stacks), Electrocute, InjectReagent(SpaceDrugs). Extinguish is in [19] Undo"
            priority: 97
          # Expect: you catch fire and STAY on fire (roll on the floor or use [19] Undo to put it out), a shock popup
          # + short stun, and 15u of space drugs in your blood (rainbow screen effect for a while).
          results:
            - !type:DebugTraceResult
            - !type:IgniteResult
              fireStacks: 3
            - !type:ElectrocuteResult
              damage: 5
              duration: 1
            - !type:InjectReagentResult
              reagent: SpaceDrugs
              amount: 15

        # ---------------- [05] Sanity / corruption ----------------
        - !type:QlippothAction
          actionName: test05Sanity
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test05
            text: "[05] Sanity: DamageSanity, RestoreSanity, SetSanityDrainMultiplier, ApplyCorruption, RemoveCorruption"
            priority: 96
          # Expect: your sanity drops 5 then comes back 5 (trace shows the exact before→after numbers), drain multiplier
          # set to ×1 (no visible change), then you are corrupted for 10 s (screen overlay / sanity ticks) and
          # immediately cleansed again. RemoveCorruption ✗ only if ApplyCorruption did not land.
          results:
            - !type:DebugTraceResult
            - !type:DamageSanityResult
              amount: 5
            - !type:RestoreSanityResult
              amount: 5
            - !type:SetSanityDrainMultiplierResult
              multiplier: 1
            - !type:ApplyCorruptionResult
              duration: 10
            - !type:RemoveCorruptionResult

        # ---------------- [06] State ----------------
        - !type:QlippothAction
          actionName: test06State
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test06
            text: "[06] State: SetState, ToggleState, IncrementState, RequireState, ClearState"
            priority: 95
          # Expect: no world change. Trace shows probe=a, then probe=b, counter=N (goes up on every click), RequireState ✓
          # with "probe=b, want b", the purple popup "State results work", then "probe cleared".
          results:
            - !type:DebugTraceResult
            - !type:SetStateResult
              key: probe
              value: a
            - !type:ToggleStateResult       # a -> b
              key: probe
              values: [a, b]
            - !type:IncrementStateResult
              key: counter
              max: 99
              wrap: true
            - !type:RequireStateResult      # passes only if ToggleState worked
              key: probe
              value: b
            - !type:PopupResult
              message: "State results work (probe went a -> b)."
              recipient: Everyone
            - !type:ClearStateResult
              key: probe

        # ---------------- [07] Flow ----------------
        - !type:QlippothAction
          actionName: test07Flow
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test07
            text: "[07] Flow: Chance, RequireTarget, RequireSituation, Random, Group, ForEachTarget, Repeat, ResetCooldown, Chain, Delay, CancelDelay, Stop"
            priority: 94
          # Expect: trace shows "100% roll passed", "1 pass the filter" (you), "situation matches" (idol on the floor),
          # ONE of the RandomResult popups (trace says which option), "GroupResult works." popup, everyone within 3 tiles
          # jitters 1 s, the test sound plays 3 times, "N cooldown(s) reset", Chain "'noListener' → 0 action(s)",
          # Delay/CancelDelay bookkeeping, then Stop ■ as the LAST entry. The "BUG" popup must never appear.
          results:
            - !type:DebugTraceResult
            - !type:ChanceResult
              chance: 1
            - !type:RequireTargetResult
              filter: { onlyMobs: true }
            - !type:RequireSituationResult
              held: false
            - !type:RandomResult
              options:
                - weight: 1
                  result: !type:PopupResult
                    message: "RandomResult picked A."
                    recipient: Everyone
                - weight: 1
                  result: !type:PopupResult
                    message: "RandomResult picked B."
                    recipient: Everyone
            - !type:GroupResult
              results:
                - !type:PopupResult
                  message: "GroupResult works."
                  recipient: Everyone
            - !type:ForEachTargetResult
              targeting: { mode: InRange, range: 3, filter: { onlyMobs: true } }
              results:
                - !type:JitterResult
                  duration: 1
            - !type:RepeatResult
              times: 3
              results:
                - !type:TestSoundResult
            - !type:ResetCooldownResult
            - !type:ChainResult             # no OnChainInitiation listens (verbs only); checks it runs without error
              key: noListener
            - !type:DelayResult
              key: noListener
              delay: 5
            - !type:CancelDelayResult
              key: noListener
            - !type:StopResult              # trace shows "Stop ■" as the LAST entry; nothing after it runs
            - !type:PopupResult             # must NOT show: StopResult ends the list even with continueOnFailure
              message: "BUG: StopResult did not stop."
              recipient: Everyone
              type: Qlippoth

        # ---------------- [08] Spawn / produce ----------------
        - !type:QlippothAction
          actionName: test08Spawn
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test08
            text: "[08] Spawn: SpawnEffect, SpawnItem, ThrowSpawned, SpawnOnTilesInRange, ShootProjectile, ReleaseGas"
            priority: 93
          # Expect: sparks on the idol, a bread next to it, two bananas fly out, sparks on every tile within 1,
          # a foam dart shoots at you, and the trace shows the tile's moles going up by 5 (no visible change).
          results:
            - !type:DebugTraceResult
            - !type:SpawnEffectResult
              prototype: EffectSparks
            - !type:SpawnItemResult
              spawnItem: FoodBreadPlain
            - !type:ThrowSpawnedResult
              prototype: FoodBanana
              count: 2
            - !type:SpawnOnTilesInRangeResult
              prototype: EffectSparks
              range: 1
            - !type:ShootProjectileResult
              projectile: BulletFoam
            - !type:ReleaseGasResult
              gasType: Oxygen
              moles: 5

        # ---------------- [09] Atmos / tiles / puddles ----------------
        - !type:QlippothAction
          actionName: test09Atmos
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test09
            text: "[09] Atmos/Tiles: HeatTile, RemoveGas, Smoke, SpillReagent, ConvertTiles"
            priority: 92
          # Expect: trace shows the tile temperature +10 K and oxygen moles going down by 5 (neither visible),
          # a smoke cloud (spread 2, 4 s), a water puddle under the idol, and about half the tiles within 1 turn to wood.
          # ConvertTiles ✗ happens when the 50% roll missed every tile: click again.
          results:
            - !type:DebugTraceResult
            - !type:HeatTileResult
              delta: 10
            - !type:RemoveGasResult
              gas: Oxygen
              moles: 5
            - !type:SmokeResult
              spread: 2
              duration: 4
            - !type:SpillReagentResult
              reagent: Water
              amount: 10
            - !type:ConvertTilesResult
              tile: FloorWood
              radius: 1
              chance: 0.5

        # ---------------- [10] Solutions (on the idol's own "beaker" solution) ----------------
        - !type:QlippothAction
          actionName: test10Solution
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test10
            text: "[10] Solution: AddReagent, HeatSolution, SpillSolution, EmptySolution"
            priority: 91
          # Expect: trace shows +20u Water into the beaker (now 20/60u), heated 293 → 350 K, a 20u water puddle on
          # the floor, +10u Water, then "emptied 10u". All visible proof is the puddle; the numbers do the rest.
          results:
            - !type:DebugTraceResult
            - !type:AddReagentResult
              reagent: Water
              amount: 20
            - !type:HeatSolutionResult
              temperature: 350
            - !type:SpillSolutionResult
            - !type:AddReagentResult
              reagent: Water
              amount: 10
            - !type:EmptySolutionResult

        # ---------------- [11] Movement ----------------
        - !type:QlippothAction
          actionName: test11Movement
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test11
            text: "[11] Movement: Pull, Face, Throw, Push, SwapPlaces, Teleport, SetAnchored(on)"
            priority: 90
          # Expect: you start pulling the idol, the idol turns to face you, you get thrown 2 tiles away from it,
          # pushed further, you and the idol swap places, the idol blinks to a random spot within 3 tiles (void
          # effect), then it is anchored (cannot be dragged until [19]). Pull ✗ if you are already pulling it.
          results:
            - !type:DebugTraceResult
            - !type:PullResult              # you start pulling the idol
              puller: { mode: Target }
              targeting: { mode: Self }
            - !type:FaceResult
            - !type:ThrowResult
              mode: AwayFromSelf
              distance: 2
            - !type:PushResult
              force: 20
            - !type:SwapPlacesResult
            - !type:TeleportResult
              destination: { mode: RandomNearSelf, range: 3 }
              effect: EffectVoidBlink
            - !type:SetAnchoredResult       # [19] Undo unanchors it
              anchored: true

        # ---------------- [12] Doors / pinpointer ----------------
        - !type:QlippothAction
          actionName: test12Doors
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test12
            text: "[12] Doors/Pinpointer: OpenDoor, SetDoorBolts, HoldDoorsInRange, SetPinpointerActive, PointAtNearest"
            priority: 89
          # Expect (airlock within 6 tiles): it opens, then bolts (red lights), every airlock within 6 is held Sealed
          # for 10 s, the idol's pinpointer screen lights up and points at the nearest gate or door.
          # No door in range: OpenDoor / SetDoorBolts ✗ with "no target: NearestInRange 6 tiles, needs Door" and
          # HoldDoors ✗ "no airlock within 6 tiles". That is the room, not a bug: move the idol next to an airlock.
          results:
            - !type:DebugTraceResult
            - !type:OpenDoorResult
              targeting: { mode: NearestInRange, range: 6, filter: { requiredComponent: Door } }
            - !type:SetDoorBoltsResult
              down: true
              targeting: { mode: NearestInRange, range: 6, filter: { requiredComponent: Door } }
            - !type:HoldDoorsInRangeResult
              mode: Sealed
              range: 6
              duration: 10
            - !type:SetPinpointerActiveResult
              active: true
            - !type:PointAtNearestResult
              targetComponents: [QGate, Door]

        # ---------------- [13] Damage reactions (EXPECT ✗ from the verb) ----------------
        # These four do not DO damage, they EDIT a damage event that is in flight:
        #   NegateDamage / ScaleIncomingDamage  -> the hit the HOLDER is about to take   (OnHolderDamagedInitiation, hand-held Qlippoths)
        #   BonusMeleeDamage                     -> the hit made WITH the Qlippoth        (OnMeleeHitInitiation / OnSelfMeleeHitInitiation)
        #   BonusAttackedDamage                  -> the hit that just landed ON the Qlippoth (OnAttackedInitiation)
        # A verb carries no damage event, so here they return ✗. The verb only proves they load and run.
        # Live demo: the "thorns" action at the end of this list (OnAttacked + BonusAttackedDamage). Hit the idol.
        - !type:QlippothAction
          actionName: test13Holder
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test13
            text: "[13] Damage reactions (✗ expected here, hit the idol for the live one): NegateDamage, ScaleIncomingDamage, BonusMeleeDamage, BonusAttackedDamage"
            priority: 88
          results:
            - !type:DebugTraceResult
            - !type:NegateDamageResult
            - !type:ScaleIncomingDamageResult
              multiplier: 0.5
            - !type:BonusMeleeDamageResult
              damage:
                types:
                  Blunt: 5
            - !type:BonusAttackedDamageResult
              damage:
                types:
                  Blunt: 5

        # ---------------- [14] Components / name ----------------
        - !type:QlippothAction
          actionName: test14Components
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test14
            text: "[14] Components: AddComponents(OwO on you), Rename(idol)"
            priority: 87
          # Expect: everything you say is OwO-ified until [19], and shift-click the idol: it is now "renamed idol".
          results:
            - !type:DebugTraceResult
            - !type:AddComponentsResult     # [19] Undo removes it
              components:
                - type: OwOAccent
            - !type:RenameResult
              name: "renamed idol"

        # ---------------- [15] Reproduce ----------------
        - !type:QlippothAction
          actionName: test15Reproduce
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test15
            text: "[15] Reproduce: SpawnMob, SpawnQlippoth, SpawnCopy, Enthrall(offspring), OfferGhostRole(offspring)"
            priority: 86
          # maxAlive counts EVERY tracked offspring of this idol, not just the prototype of that result. Caps must
          # therefore grow down the list, or the mouse alone blocks the two spawns after it.
          # Expect: a mouse, a test Qlippoth and a second idol next to you; both get a ghost-role offer.
          results:
            - !type:DebugTraceResult
            - !type:SpawnMobResult
              spawnMob: MobMouse
              ghostRole: false
              maxAlive: 3
            - !type:SpawnQlippothResult
              spawnQlippoth: MobQlippothTest
              maxAlive: 5
            - !type:SpawnCopyResult
              maxAlive: 6
            - !type:EnthrallResult
              targeting: { mode: Offspring }
            - !type:OfferGhostRoleResult
              targeting: { mode: Offspring }

        # ---------------- [16] Kill offspring ----------------
        - !type:QlippothAction
          actionName: test16Offspring
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test16
            text: "[16] Offspring end: SetMobState(dead), Gib, Delete, CullOffspring"
            priority: 85
          # Expect (after [15]): the offspring drop dead, the mice gib into blood, whatever is left is deleted, and the
          # trace ends with CullOffspring. Everything ✗ with "no target: Offspring" = run [15] first.
          results:
            - !type:DebugTraceResult
            - !type:SetMobStateResult
              state: Dead
              targeting: { mode: Offspring }
            - !type:GibResult               # mice gib; Qlippoth offspring without a body are left for Delete
              targeting: { mode: Offspring }
            - !type:DeleteResult
              targeting: { mode: Offspring }
            - !type:CullOffspringResult

        # ---------------- [17] Conversion ----------------
        - !type:QlippothAction
          actionName: test17Conversion
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test17
            text: "[17] Conversion: ReplaceEntity(food -> bread), Polymorph(you -> carp, 10s)"
            priority: 84
          # Expect: a banana appears and instantly becomes bread (trace: → banana), then you turn into a magic carp
          # for 10 s (or use [19] RevertPolymorph as the carp). Right-click works as the carp.
          results:
            - !type:DebugTraceResult
            - !type:SpawnItemResult
              spawnItem: FoodBanana
            - !type:ReplaceEntityResult
              prototype: FoodBreadPlain
              transferMind: false
              targeting: { mode: NearestInRange, range: 3, filter: { requiredComponent: Edible } }
            - !type:PolymorphResult
              configuration:
                entity: MobCarpMagic
                duration: 10
                forced: true
                revertOnDeath: true

        # ---------------- [18] Events ----------------
        - !type:QlippothAction
          actionName: test18Events
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test18
            text: "[18] Events: Announce, DebugAnnounce, Signal"
            priority: 83
          # Expect: station announcement "AnnounceResult works." (no sound), a second DEBUG announcement, and if an
          # idol of many ears is within 10 tiles its "signal" action announces too. Signal detail: "'showcase-test' → N listener(s)".
          results:
            - !type:DebugTraceResult
            - !type:AnnounceResult
              message: "AnnounceResult works."
              playSound: false
            - !type:DebugAnnounceResult
              note: "DebugAnnounceResult works."
            - !type:SignalResult
              signal: showcase-test
              range: 10

        # ---------------- [19] Undo ----------------
        - !type:QlippothAction
          actionName: test19Undo
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test19
            text: "[19] Undo: Extinguish(you), RemoveComponents, Rename(back), SetAnchored(off), Pull(release), SetDoorBolts(up), HoldDoors(release), Pinpointer(off), RevertPolymorph, SetLight(back)"
            priority: 82
          # Expect: fire out, OwO gone, name back, idol draggable again, pull released, bolts up, doors released,
          # pinpointer screen off, you are human again, glow back to purple. ✗ on anything that was not changed is
          # normal (e.g. "was not burning", "has no OwOAccent", "no target: ... needs Door").
          results:
            - !type:DebugTraceResult
            - !type:ExtinguishResult       # undoes [04]
            - !type:RemoveComponentsResult
              components: [OwOAccent]
            - !type:RenameResult
              name: "idol of many mouths"
            - !type:SetAnchoredResult
              anchored: false
            - !type:PullResult
              puller: { mode: Target }
              targeting: { mode: Self }
              release: true
            - !type:SetDoorBoltsResult
              down: false
              targeting: { mode: NearestInRange, range: 6, filter: { requiredComponent: Door } }
            - !type:HoldDoorsInRangeResult
              mode: Released
              range: 6
            - !type:SetPinpointerActiveResult
              active: false
            - !type:RevertPolymorphResult  # click it while you are the carp
            - !type:SetLightResult
              color: "#9B30FF"
              radius: 3

        # ---------------- [!] disruptive ----------------
        - !type:QlippothAction
          actionName: test20Blast
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test20
            text: "[20][!] Blast: Explosion(small), Emp, Hotspot"
            priority: 81
          # Expect: a small explosion on the idol (floor scorch, you take damage if adjacent), an EMP pulse within 2
          # tiles (lights flicker, batteries drain), and a hotspot: the tile burns for a moment (stand back).
          results:
            - !type:DebugTraceResult
            - !type:ExplosionResult
              totalIntensity: 5
              maxTileIntensity: 2
            - !type:EmpResult
              range: 2
            - !type:HotspotResult
              temperature: 600
              volume: 20
        - !type:QlippothAction
          actionName: test21Round
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test21
            text: "[21][!] Round: AlertLevel(blue), StartGameRule, EndGameRule, CallShuttle, CallShuttle(recall)"
            priority: 80
          # Expect: alert goes BLUE (announcement + lights), MassHallucinations starts then ends at once, the
          # emergency shuttle is called then recalled (two announcements). Idol of many ears announces each event too.
          results:
            - !type:DebugTraceResult
            - !type:AlertLevelResult
              level: blue
            - !type:StartGameRuleResult
              ruleId: MassHallucinations
            - !type:EndGameRuleResult
              ruleId: MassHallucinations
            - !type:CallShuttleResult
            - !type:CallShuttleResult
              recall: true
        - !type:QlippothAction
          actionName: test22Gates
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test22
            text: "[22][!] Gates: BreachGates(nearest)"
            priority: 79
          # Expect: the nearest unbreached gate breaches (its event + announcement). ✗ "no unbreached gate" when none.
          results:
            - !type:DebugTraceResult
            - !type:BreachGatesResult
        - !type:QlippothAction
          actionName: test23Mind
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: test23
            text: "[23][!] Mind: TransferMind(swap with idol)"
            priority: 78
          # Expect: your view jumps into the idol; your old body stands empty. Click [23] again from the idol to swap back.
          results:
            - !type:DebugTraceResult
            - !type:TransferMindResult
              mode: Swap

        # ---------------- live demo for [13]: hit the idol ----------------
        - !type:QlippothAction
          actionName: thorns                # melee the idol with anything
          initiation: !type:OnAttackedInitiation
          results:
            - !type:BonusAttackedDamageResult   # the hit that just landed does +5 Blunt extra
              damage:
                types:
                  Blunt: 5
            - !type:PopupResult
              message: "BonusAttackedDamage: your hit on {$self} just did +5 Blunt extra."
              recipient: Actor
              type: Qlippoth


# SHOWCASE INSTANCE - INITIATION TESTER #
# ============================================================================================
# RULE: EVERY QlippothInitiation MUST BE ON THIS ENTITY.
# When you add a new initiation class to Content.Server/Qlippoth/Actions/QlippothInitiation.cs, add one action for it
# below in the same change. This idol is the in-game tester for the whole initiation list.
#
# How it works:
#   - One action per initiation. The ONLY result is DebugAnnounceResult, so every firing is a station-wide
#     announcement: "<actionName>" INITIATION, TRIGGERED "<InitiationClass>" RESULT [idol -> target] trigger: <what you did>.
#     The trailing "trigger:" note says what fired it, so an unexpected announcement explains itself.
#     You can see it from anywhere on the map; the same line also goes to the server log.
#   - Right-click the idol -> Qlippoth -> "How do I trigger these?" whispers you a cheat sheet grouped by how to fire them.
#   - It is a small item, so hand / pocket / throw / container initiations can be tested by hand.
#   - Polled initiations (interval, range, gas, temperature...) have long intervals or cooldowns so they do not spam.
#   - Pairs with ResultShowcaseIdol: its [18] Events verb sends "showcase-test", which OnSignal here listens to.
#   - Some initiations cannot fire on this entity by design; they are still here so they load. See "NOT FIREABLE" notes.
# ============================================================================================
- type: entity
  id: InitiationShowcaseIdol
  parent: QlippothItemBase
  name: idol of many ears
  description: A small stone figure covered in ears. Admins use it to test every Qlippoth initiation.
  components:
    - type: Qlippoth
      gatePhases: []   # admin-spawn only
      marketPrice: 100
      researchPoints: 10
    - type: QlippothMovement
      movementType: Inanimate
    - type: Sprite
      layers:
        - state: front
    # Health, so OnDamaged / OnHealthThreshold / OnDestroyed can fire (items have none by default).
    - type: Damageable
      damageModifierSet: Metallic
    - type: Injurable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 50
        behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
    # Item action button (the gaze scepter's "Seek" button, key: seek) for OnAction / OnSelfAction.
    - type: ActionGrant
      actions:
        - ActionQlippothGazeSeek
    - type: ItemActionGrant
      actions:
        - ActionQlippothGazeSeek
    - type: QlippothActions
      state:
        showcase: "on"    # for WhileState
      actions:
        # ---------------- Trigger ----------------
        - !type:QlippothAction
          actionName: pull
          initiation: !type:OnPullInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: someone grabbed / started pulling it"
        - !type:QlippothAction
          actionName: pullStopped
          initiation: !type:OnPullStoppedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: the pull was released"
        - !type:QlippothAction
          actionName: pickedUp
          initiation: !type:OnPickedUpInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: picked up into a hand"
        - !type:QlippothAction
          actionName: dropped
          initiation: !type:OnDroppedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: dropped from a hand"
        - !type:QlippothAction
          actionName: holderDamaged       # hold it and get hit
          initiation: !type:OnHolderDamagedInitiation
          cooldown: 2
          results:
            - !type:DebugAnnounceResult
              note: "trigger: whoever holds it took damage (2 s cooldown)"
        - !type:QlippothAction
          actionName: meleeHit            # hit something with it
          initiation: !type:OnMeleeHitInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: it was swung and hit something"
        - !type:QlippothAction
          actionName: corruptionApplied   # NOT FIREABLE here unless this idol applies corruption
          initiation: !type:OnCorruptionAppliedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: this idol corrupted someone (needs an ApplyCorruption result on it, so normally never)"
        - !type:QlippothAction
          actionName: corruptionPulse     # NOT FIREABLE here unless this idol applies corruption
          initiation: !type:OnCorruptionPulseInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: a corruption it applied pulsed (normally never)"
        - !type:QlippothAction
          actionName: damaged
          initiation: !type:OnDamagedInitiation
          cooldown: 2
          results:
            - !type:DebugAnnounceResult
              note: "trigger: the idol took damage (2 s cooldown)"
        - !type:QlippothAction
          actionName: mobState            # NOT FIREABLE: the idol has no MobState
          initiation: !type:OnMobStateInitiation
          results:
            - !type:DebugAnnounceResult
              note: "NOT FIREABLE: the idol has no MobState"
        - !type:QlippothAction
          actionName: holderMobState      # hold it while you crit / die
          initiation: !type:OnHolderMobStateInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: its holder went crit / died / recovered"
        - !type:QlippothAction
          actionName: destroyed           # 50 damage
          initiation: !type:OnDestroyedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: the idol reached 50 damage and broke"
        - !type:QlippothAction
          actionName: spawn
          initiation: !type:OnSpawnInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: the idol was spawned"
        - !type:QlippothAction
          actionName: collide             # throw it at someone
          initiation: !type:OnCollideInitiation
          cooldown: 2
          results:
            - !type:DebugAnnounceResult
              note: "trigger: it physically hit something (thrown into a mob / wall, 2 s cooldown)"
        - !type:QlippothAction
          actionName: stepTrigger         # NOT FIREABLE: the idol has no StepTrigger
          initiation: !type:OnStepTriggerInitiation
          results:
            - !type:DebugAnnounceResult
              note: "NOT FIREABLE: the idol has no StepTrigger"
        - !type:QlippothAction
          actionName: anchorChanged       # NOT FIREABLE: an item cannot be anchored
          initiation: !type:OnAnchorChangedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "NOT FIREABLE: items cannot be anchored"
        - !type:QlippothAction
          actionName: powerChanged        # NOT FIREABLE: the idol has no power receiver
          initiation: !type:OnPowerChangedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "NOT FIREABLE: the idol has no power receiver"
        - !type:QlippothAction
          actionName: stateChanged        # NOT FIREABLE: no result here changes state
          initiation: !type:OnStateChangedInitiation
            key: showcase
          results:
            - !type:DebugAnnounceResult
              note: "NOT FIREABLE here: nothing changes the 'showcase' state key"
        - !type:QlippothAction
          actionName: offspringDied       # NOT FIREABLE: this idol spawns no offspring
          initiation: !type:OnOffspringDiedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "NOT FIREABLE here: this idol spawns nothing"
        - !type:QlippothAction
          actionName: enterRange
          initiation: !type:OnEnterRangeInitiation
            range: 3
          cooldown: 10
          results:
            - !type:DebugAnnounceResult
              note: "trigger: a mob came within 3 tiles (10 s cooldown)"
        - !type:QlippothAction
          actionName: leaveRange
          initiation: !type:OnLeaveRangeInitiation
            range: 3
          cooldown: 10
          results:
            - !type:DebugAnnounceResult
              note: "trigger: a mob left the 3-tile radius (10 s cooldown)"
        - !type:QlippothAction
          actionName: crowd               # 2+ people within 6 tiles
          initiation: !type:OnCrowdInitiation
            minCount: 2
          cooldown: 10
          results:
            - !type:DebugAnnounceResult
              note: "trigger: 2+ mobs within 6 tiles (10 s cooldown)"
        - !type:QlippothAction
          actionName: gas                 # 1+ mol plasma on its tile
          initiation: !type:OnGasInitiation
            gas: Plasma
          results:
            - !type:DebugAnnounceResult
              note: "trigger: 1+ mol plasma on its tile"
        - !type:QlippothAction
          actionName: temperature         # below 250 K (e.g. space)
          initiation: !type:OnTemperatureInitiation
            max: 250
          results:
            - !type:DebugAnnounceResult
              note: "trigger: its tile is below 250 K (space / freezer)"
        - !type:QlippothAction
          actionName: pressure            # below 50 kPa (e.g. space)
          initiation: !type:OnPressureInitiation
            max: 50
          results:
            - !type:DebugAnnounceResult
              note: "trigger: its tile is below 50 kPa (space)"
        - !type:QlippothAction
          actionName: healthThreshold     # damage above 10
          initiation: !type:OnHealthThresholdInitiation
            threshold: 10
          cooldown: 10
          results:
            - !type:DebugAnnounceResult
              note: "trigger: its damage went above 10 (10 s cooldown)"
        - !type:QlippothAction
          actionName: holderSanity        # held by someone with sanity 0-100
          initiation: !type:OnHolderSanityInitiation
            max: 100
          results:
            - !type:DebugAnnounceResult
              note: "trigger: held by someone whose sanity is 0-100, i.e. anyone"
        - !type:QlippothAction
          actionName: lightLevel          # carry it into the dark
          initiation: !type:OnLightLevelInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: no lit light source in range (carried into the dark)"

        # ---------------- External ----------------
        - !type:QlippothAction
          actionName: action              # press the Seek button while holding it
          initiation: !type:OnActionInitiation
            key: seek
          results:
            - !type:DebugAnnounceResult
              note: "trigger: the holder pressed the Seek action button"
        - !type:QlippothAction
          actionName: usedOn              # hold it and click another entity
          initiation: !type:OnUsedOnInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: the holder clicked another entity with it"
        - !type:QlippothAction
          actionName: activate            # E / activate it on the floor
          initiation: !type:OnActivateInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: activated with E / clicked while on the floor"
        - !type:QlippothAction
          actionName: interactHand        # empty-hand click
          initiation: !type:OnInteractHandInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: clicked with an empty hand"
        - !type:QlippothAction
          actionName: useInHand           # Z while holding it
          initiation: !type:OnUseInHandInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: Z / use-in-hand while holding it"
        - !type:QlippothAction
          actionName: interactUsing       # click it with an item
          initiation: !type:OnInteractUsingInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: clicked with an item in hand"
        - !type:QlippothAction
          actionName: attacked            # hit it
          initiation: !type:OnAttackedInitiation
          cooldown: 2
          results:
            - !type:DebugAnnounceResult
              note: "trigger: melee hit on the idol (2 s cooldown)"
        - !type:QlippothAction
          actionName: thrown
          initiation: !type:OnThrownInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: it was thrown"
        - !type:QlippothAction
          actionName: land
          initiation: !type:OnLandInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: the throw landed"
        - !type:QlippothAction
          actionName: throwHit            # throw it at someone
          initiation: !type:OnThrowHitInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: the throw hit something"
        - !type:QlippothAction
          actionName: equipped            # put it in a pocket
          initiation: !type:OnEquippedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: put into a pocket / clothing slot"
        - !type:QlippothAction
          actionName: unequipped          # take it out of the pocket
          initiation: !type:OnUnequippedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: taken out of a pocket / clothing slot"
        - !type:QlippothAction
          actionName: heard               # say "idol" near it
          initiation: !type:OnHeardInitiation
            keywords: [idol]
          results:
            - !type:DebugAnnounceResult
              note: "trigger: someone said 'idol' within earshot"
        - !type:QlippothAction
          actionName: insertedIntoContainer # put it in a bag / crate
          initiation: !type:OnInsertedIntoContainerInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: put into a bag / crate / locker"
        - !type:QlippothAction
          actionName: removedFromContainer
          initiation: !type:OnRemovedFromContainerInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: taken out of a bag / crate / locker"
        - !type:QlippothAction
          actionName: entityInserted      # NOT FIREABLE: the idol has no container of its own
          initiation: !type:OnEntityInsertedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "NOT FIREABLE: the idol has no container of its own"
        - !type:QlippothAction
          actionName: entityRemoved       # NOT FIREABLE: the idol has no container of its own
          initiation: !type:OnEntityRemovedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "NOT FIREABLE: the idol has no container of its own"

        # ---------------- Internal (need a player controlling the idol: admin "control mob") ----------------
        - !type:QlippothAction
          actionName: selfAction          # the controlled idol presses its own Seek button
          initiation: !type:OnSelfActionInitiation
            key: seek
          results:
            - !type:DebugAnnounceResult
              note: "trigger: a player controlling the idol pressed its Seek button"
        - !type:QlippothAction
          actionName: chain               # NOT FIREABLE: no ChainResult here (see ResultShowcaseIdol)
          initiation: !type:OnChainInitiation
            key: showcase
          results:
            - !type:DebugAnnounceResult
              note: "NOT FIREABLE here: nothing chains to key 'showcase' (ChainResult lives on ResultShowcaseIdol [07])"
        - !type:QlippothAction
          actionName: spoke
          initiation: !type:OnSpokeInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: a player controlling the idol spoke"
        - !type:QlippothAction
          actionName: emote
          initiation: !type:OnEmoteInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: a player controlling the idol emoted"
        - !type:QlippothAction
          actionName: mindAdded
          initiation: !type:OnMindAddedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: a player took control of the idol"
        - !type:QlippothAction
          actionName: mindRemoved
          initiation: !type:OnMindRemovedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: the controlling player left the idol"
        - !type:QlippothAction
          actionName: selfMeleeHit        # NOT FIREABLE: the idol has no melee attack of its own
          initiation: !type:OnSelfMeleeHitInitiation
          results:
            - !type:DebugAnnounceResult
              note: "NOT FIREABLE: the idol cannot melee by itself"

        # ---------------- Timed ----------------
        - !type:QlippothAction
          actionName: interval            # every 60 s
          initiation: !type:IntervalInitiation
            interval: 60
          results:
            - !type:DebugAnnounceResult
              note: "trigger: 60 s timer"
        - !type:QlippothAction
          actionName: proximity           # every 30 s while someone is within 3 tiles
          initiation: !type:ProximityInitiation
            interval: 30
            range: 3
          results:
            - !type:DebugAnnounceResult
              note: "trigger: 30 s timer, only while someone is within 3 tiles"
        - !type:QlippothAction
          actionName: afterDelay          # once, 10 s after spawn
          initiation: !type:AfterDelayInitiation
            delay: 10
          results:
            - !type:DebugAnnounceResult
              note: "trigger: once, 10 s after spawn"
        - !type:QlippothAction
          actionName: roundTime           # once the round is 60 s old
          initiation: !type:RoundTimeInitiation
            atRoundTime: 60
          results:
            - !type:DebugAnnounceResult
              note: "trigger: once, when the round is 60 s old"
        - !type:QlippothAction
          actionName: whileState          # every 120 s while showcase = on (always)
          initiation: !type:WhileStateInitiation
            key: showcase
            value: "on"
            interval: 120
          results:
            - !type:DebugAnnounceResult
              note: "trigger: 120 s timer while state showcase=on (always on here)"
        - !type:QlippothAction
          actionName: whilePulled         # every 5 s while pulled
          initiation: !type:WhilePulledInitiation
            interval: 5
          results:
            - !type:DebugAnnounceResult
              note: "trigger: 5 s timer while being pulled"
        - !type:QlippothAction
          actionName: whileInContainer    # every 10 s while in a bag
          initiation: !type:WhileInContainerInitiation
            interval: 10
          results:
            - !type:DebugAnnounceResult
              note: "trigger: 10 s timer while inside a container"

        # ---------------- Event based ----------------
        - !type:QlippothAction
          actionName: gameRuleStarted     # any rule
          initiation: !type:OnGameRuleStartedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: any game rule started"
        - !type:QlippothAction
          actionName: gameRuleEnded       # any rule
          initiation: !type:OnGameRuleEndedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: any game rule ended"
        - !type:QlippothAction
          actionName: alertLevel          # any level
          initiation: !type:OnAlertLevelInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: the station alert level changed"
        - !type:QlippothAction
          actionName: signal              # ResultShowcaseIdol [18] sends this within 10 tiles
          initiation: !type:OnSignalInitiation
            signal: showcase-test
          results:
            - !type:DebugAnnounceResult
              note: "trigger: received 'showcase-test' (ResultShowcaseIdol [18] within 10 tiles)"
        - !type:QlippothAction
          actionName: arrived             # only when it comes through a gate / capsule (admin-spawn does not count)
          initiation: !type:OnArrivedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: came through a gate / capsule (admin spawn does not count)"
        - !type:QlippothAction
          actionName: contained
          initiation: !type:OnContainedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: placed into a containment chamber"
        - !type:QlippothAction
          actionName: containmentBreached
          initiation: !type:OnContainmentBreachedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: its containment chamber was breached"
        - !type:QlippothAction
          actionName: escapedContainment
          initiation: !type:OnEscapedContainmentInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: it left containment"
        - !type:QlippothAction
          actionName: gateCleared
          initiation: !type:OnGateClearedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: a gate was cleared"
        - !type:QlippothAction
          actionName: anyGateBreached
          initiation: !type:OnAnyGateBreachedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: any gate was breached"
        - !type:QlippothAction
          actionName: gateSpawned
          initiation: !type:OnGateSpawnedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: a gate spawned"
        - !type:QlippothAction
          actionName: shuttleCalled       # called or recalled
          initiation: !type:OnShuttleCalledInitiation
            called: null
          results:
            - !type:DebugAnnounceResult
              note: "trigger: evac shuttle called or recalled"
        - !type:QlippothAction
          actionName: roundEnd
          initiation: !type:OnRoundEndInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: the round ended"

        # ---------------- Interface ----------------
        - !type:QlippothAction
          actionName: howToTest           # whispers the tester a cheat sheet; not an initiation under test
          continueOnFailure: true
          initiation: !type:VerbInitiation
            key: howto
            text: "How do I trigger these? (cheat sheet)"
            priority: 100
          results:
            - !type:WhisperToResult
              message: "IN HAND: pick up, drop, Z (use in hand), click another thing with it (usedOn), press the Seek button (action), get hit while holding it (holderDamaged), go crit while holding it (holderMobState), swing it at something (meleeHit)."
            - !type:WhisperToResult
              message: "ON THE FLOOR: E (activate), empty-hand click (interactHand), click with an item (interactUsing), hit it (attacked, damaged, healthThreshold above 10, destroyed at 50), pull it (pull, whilePulled every 5 s, pullStopped), shift-click (examined), walk up to it / away (enterRange, leaveRange at 3 tiles), bring a friend (crowd, 2+ within 6 tiles)."
            - !type:WhisperToResult
              message: "THROW / STORE: throw it (thrown, land, throwHit, collide), pocket it (equipped, unequipped), bag or crate it (insertedIntoContainer, whileInContainer every 10 s, removedFromContainer)."
            - !type:WhisperToResult
              message: "ENVIRONMENT: plasma on its tile (gas), below 250 K (temperature), below 50 kPa (pressure), no lit light nearby (lightLevel), say 'idol' near it (heard), anyone holding it (holderSanity)."
            - !type:WhisperToResult
              message: "TIMERS: interval 60 s, proximity 30 s while someone is within 3 tiles, afterDelay once at 10 s, roundTime once at 60 s, whileState every 120 s."
            - !type:WhisperToResult
              message: "ROUND EVENTS: any game rule start / end, alert level change, shuttle call / recall, round end, gate spawned / cleared / breached, containment events, 'showcase-test' signal from ResultShowcaseIdol [18]. CONTROL THE IDOL (admin): spoke, emote, mindAdded, mindRemoved, selfAction."
            - !type:WhisperToResult
              message: "NOT FIREABLE on this item by design: mobState, stepTrigger, anchorChanged, powerChanged, stateChanged, offspringDied, entityInserted, entityRemoved, chain, selfMeleeHit, corruptionApplied, corruptionPulse."
        - !type:QlippothAction
          actionName: verb                # right-click -> Qlippoth -> Test initiation
          initiation: !type:VerbInitiation
            key: showcase
            text: "Test VerbInitiation"
          results:
            - !type:DebugAnnounceResult
              note: "trigger: the 'Test VerbInitiation' verb was clicked"
        - !type:QlippothAction
          actionName: examined            # shift-click
          initiation: !type:OnExaminedInitiation
          results:
            - !type:DebugAnnounceResult
              note: "trigger: shift-click examine"
            - !type:PopupResult
              message: "EXAMINED"
              recipient: Actor
              type: Qlippoth


#region specific examples
# ============================================================================================
# SHARED BUILDING BLOCK EXAMPLES - DO NOT DELETE
# The three entities below are the reference examples linked from the <summary> docs of
# QlippothTargetFilter / QlippothTargeting / QlippothDestination in Content.Server/Qlippoth/Actions/QlippothAction.cs.
# They are admin-spawn only (gatePhases: []) and exist so a developer can read one working copy of every
# field of these blocks. Keep them compiling against the C# even if you never spawn them.
# ============================================================================================

# --- QlippothTargetFilter usage example (filter: / usedFilter: / userFilter: / speakerFilter:) ---
# Filter answers "does this entity count?". Empty filter = everything counts.
- type: entity
  id: QlippothExampleFilter
  parent: QlippothLargeBase
  name: TEST QlippothTargetFilter
  description: Test entity for the filter block (QlippothTargetFilter). It only notices certain people. DO NOT DELETE, see QlippothAction.cs.
  components:
    - type: Qlippoth
      gatePhases: []   # admin-spawn only
    - type: QlippothMovement
      movementType: Inanimate
    - type: QlippothActions
      actions:
        # USAGE EXAMPLE (filter on an aura): only living, player-controlled crew that are not other Qlippoths react.
        # excludeHolder is meaningless here (a Large object is never held) and is only shown for completeness.
        - !type:QlippothAction
          actionName: exampleFilterAura
          initiation: !type:ProximityInitiation
            interval: 2
            range: 5
            requiredComponent: MobState        # coarse pre-filter by component name
            filter:                            # <-- QlippothTargetFilter
              onlyAlive: true
              onlyPlayers: true
              excludeQlippoths: true
              excludeOffspring: true
              excludeHolder: true
          results:
            - !type:DebugAnnounceResult
              note: "(proximity test)"
            - !type:ToggleGlowResult           # pulses once per tick: visible proof the filtered aura is running
              color: "#40FF80"
              radius: 5
        # USAGE EXAMPLE (two filters on one initiation): the item used on it AND the user are filtered separately.
        # whitelist/blacklist are SS14 EntityWhitelist: tags, components, sizes, requireAll.
        - !type:QlippothAction
          actionName: exampleFilterFeed
          initiation: !type:OnInteractUsingInitiation
            usedFilter:                        # <-- QlippothTargetFilter on the item
              whitelist: { tags: [Meat] }
              forbiddenComponents: [Qlippoth]  # never eat another Qlippoth
            userFilter:                        # <-- QlippothTargetFilter on the player
              onlyPlayers: true
              onlyAlive: true
            consumeUsed: true
          results:
            - !type:DebugTraceResult           # popup: which initiation fired
            - !type:TestSoundResult
            - !type:SayActorNameResult         # says the name of the player who fed it
            - !type:PopupResult
              message: "The sieve accepts the offering."
              recipient: Actor
        # USAGE EXAMPLE (filter on a collision): mobs only, skip other Qlippoths and its own spawned servants, skip dead bodies.
        - !type:QlippothAction
          actionName: exampleFilterBump
          initiation: !type:OnCollideInitiation
            filter:                            # <-- QlippothTargetFilter
              requiredComponents: [MobState, Transform]
              blacklist: { components: [Qlippoth] }
              excludeOffspring: true
              onlyAlive: true
          cooldown: 2
          results:
            - !type:DebugTraceResult
            - !type:MindMessageResult          # only the mob that bumped into it reads this
              message: "The sieve felt you."
            - !type:PopupResult
              message: "The sieve shudders as {$target} touches it."
              recipient: Everyone
        # USAGE EXAMPLE (filter as a mid-chain gate): RequireTargetResult stops the chain unless the target passes.
        - !type:QlippothAction
          actionName: exampleFilterGate
          initiation: !type:OnPullInitiation
          results:
            - !type:DebugTraceResult           # fires before the gate: proves the initiation was reached
            - !type:RequireTargetResult
              filter: { anchored: false, minDamage: 10 }   # <-- QlippothTargetFilter: only already-hurt pullers
            - !type:TestSoundResult            # everything below here only runs when the gate passes
            - !type:SayActorNameResult
              format: "{name} is already bleeding."
            - !type:MindMessageResult
              message: "The sieve tastes your wounds."

# --- QlippothTargeting usage example (targeting: on results) ---
# Targeting answers "who does this result act on?". Default mode Target = whoever the initiation handed over.
- type: entity
  id: QlippothExampleTargeting
  parent: QlippothLargeBase
  name: TEST QlippothTargeting
  description: Test entity for the targeting block (QlippothTargeting). Every verb on it aims a different way. DO NOT DELETE, see QlippothAction.cs.
  components:
    - type: Qlippoth
      gatePhases: []   # admin-spawn only
    - type: QlippothMovement
      movementType: Inanimate
    - type: PointLight
      radius: 3
      energy: 1
      color: "#40C0FF"
    - type: QlippothActions
      actions:
        # USAGE EXAMPLE (mode Target, the default): no targeting written -> acts on the player who clicked the verb.
        - !type:QlippothAction
          actionName: exampleTargetDefault
          initiation: !type:VerbInitiation
            key: touch
            text: "Touch (Target)"
          results:
            # Default targeting (mode Target) = whoever the initiation handed over, here the player who clicked:
            # only they get the private line, and the jitter is applied to them and nobody else.
            - !type:WhisperToResult
              message: "It touched you back."
            - !type:JitterResult
              duration: 2
        # USAGE EXAMPLE (mode Self): the Qlippoth acts on itself.
        - !type:QlippothAction
          actionName: exampleTargetSelf
          initiation: !type:VerbInitiation
            key: glow
            text: "Glow (Self)"
          results:
            - !type:SetLightResult
              targeting: { mode: Self }        # <-- QlippothTargeting
              color: "#FF4040"
              radius: 5
        # USAGE EXAMPLE (mode InRange + range + maxTargets + filter): at most 2 living mobs within 3 tiles.
        - !type:QlippothAction
          actionName: exampleTargetInRange
          initiation: !type:VerbInitiation
            key: pulse
            text: "Pulse (InRange)"
          cooldown: 3
          results:
            - !type:DamageResult
              damage: { types: { Heat: 3 } }
              targeting:                       # <-- QlippothTargeting
                mode: InRange
                range: 3
                maxTargets: 2
                filter: { onlyAlive: true }
        # USAGE EXAMPLE (mode AroundTarget): flash everyone within 2 tiles of the clicker, not of the Qlippoth.
        - !type:QlippothAction
          actionName: exampleTargetAroundTarget
          initiation: !type:VerbInitiation
            key: flashAround
            text: "Flash around you (AroundTarget)"
          cooldown: 3
          results:
            - !type:FlashResult
              duration: 2
              targeting: { mode: AroundTarget, range: 2, includeSelf: false }   # <-- QlippothTargeting
        # USAGE EXAMPLE (mode NearestInRange): whisper only to the closest player.
        - !type:QlippothAction
          actionName: exampleTargetNearest
          initiation: !type:IntervalInitiation
            interval: 15
          results:
            - !type:WhisperToResult
              message: "You are the closest."
              targeting: { mode: NearestInRange, range: 8, filter: { onlyPlayers: true } }   # <-- QlippothTargeting
        # USAGE EXAMPLE (mode RandomInRange): one random mob within 5 tiles shakes.
        - !type:QlippothAction
          actionName: exampleTargetRandom
          initiation: !type:VerbInitiation
            key: shake
            text: "Shake someone (RandomInRange)"
          results:
            - !type:JitterResult
              duration: 3
              targeting: { mode: RandomInRange, range: 5, filter: { onlyMobs: true } }   # <-- QlippothTargeting
        # USAGE EXAMPLE (mode Actor vs PullPartner): when pulled, stun the puller (Actor), make whoever is attached
        # let go (PullPartner), then throw the puller away.
        # NOTE: the release step is required, not decoration. A pull creates a distance joint between the two
        # entities, so a throw while the pull is still active is clamped back and looks like it did nothing.
        - !type:QlippothAction
          actionName: exampleTargetPull
          initiation: !type:OnPullInitiation
          cooldown: 5
          results:
            - !type:StunResult
              duration: 1
              targeting: { mode: Actor }       # <-- QlippothTargeting: read from the event args
            - !type:PullResult                 # let go of the Qlippoth, breaking the joint
              release: true
              puller: { mode: PullPartner }    # <-- QlippothTargeting: read from the components, not the event
              targeting: { mode: Self }
            - !type:ThrowResult
              mode: AwayFromSelf
              distance: 2
              targeting: { mode: Actor }
        # USAGE EXAMPLE (mode Offspring): spawn servants, then a second verb culls exactly those servants.
        - !type:QlippothAction
          actionName: exampleTargetSpawn
          initiation: !type:VerbInitiation
            key: spawn
            text: "Call rats"
          results:
            - !type:SpawnMobResult
              spawnMob: MobRatServant
              count: 2
              maxAlive: 4
              ghostRole: false
        - !type:QlippothAction
          actionName: exampleTargetOffspring
          initiation: !type:VerbInitiation
            key: cull
            text: "Dismiss rats (Offspring)"
          results:
            - !type:DeleteResult
              targeting: { mode: Offspring }   # <-- QlippothTargeting
        # USAGE EXAMPLE (mode QlippothsInRange): make every other Qlippoth within 8 tiles speak.
        - !type:QlippothAction
          actionName: exampleTargetQlippoths
          initiation: !type:VerbInitiation
            key: chorus
            text: "Chorus (QlippothsInRange)"
          results:
            - !type:SpeakResult
              message: "..."
              emote: true
              targeting: { mode: QlippothsInRange, range: 8 }   # <-- QlippothTargeting
        # NOTE: mode Holder only resolves on hand-held / worn Qlippoths (QlippothItemBase / QlippothClothingBase). Not shown here.

# --- QlippothDestination usage example (destination: on teleport / spawn results) ---
# Destination answers "where?". Often combined with targeting: targeting picks WHO moves, destination picks WHERE.
- type: entity
  id: QlippothExampleDestination
  parent: QlippothLargeBase
  name: TEST QlippothDestination
  description: Test entity for the destination block (QlippothDestination). It moves things to places. DO NOT DELETE, see QlippothAction.cs.
  components:
    - type: Qlippoth
      gatePhases: []   # admin-spawn only
    - type: QlippothMovement
      movementType: Inanimate
    - type: QlippothActions
      actions:
        # USAGE EXAMPLE (mode RandomNearSelf + range): the Qlippoth blinks up to 5 tiles away.
        - !type:QlippothAction
          actionName: exampleDestinationBlink
          initiation: !type:VerbInitiation
            key: blink
            text: "Blink (RandomNearSelf)"
          cooldown: 2
          results:
            - !type:TeleportResult
              targeting: { mode: Self }
              destination: { mode: RandomNearSelf, range: 5 }   # <-- QlippothDestination
              effect: EffectVoidBlink
        # USAGE EXAMPLE (mode RandomOnStation): the clicker is sent somewhere random on the station.
        - !type:QlippothAction
          actionName: exampleDestinationBanish
          initiation: !type:VerbInitiation
            key: banish
            text: "Banish me (RandomOnStation)"
          cooldown: 5
          results:
            - !type:TeleportResult
              targeting: { mode: Target }
              destination: { mode: RandomOnStation }           # <-- QlippothDestination
              scatter: 0
              effect: EffectVoidBlink
        # USAGE EXAMPLE (mode Target + scatter on a spawn): rats appear around the clicker, not around the Qlippoth.
        - !type:QlippothAction
          actionName: exampleDestinationSummon
          initiation: !type:VerbInitiation
            key: summon
            text: "Summon at me (Target)"
          results:
            - !type:SpawnMobResult
              spawnMob: MobRatServant
              count: 2
              scatter: 1
              destination: { mode: Target }                    # <-- QlippothDestination
              ghostRole: false
              maxAlive: 4
        # USAGE EXAMPLE (mode Offset): a fixed offset in tiles from the Qlippoth; offset is also ADDED to every other mode.
        - !type:QlippothAction
          actionName: exampleDestinationOffset
          initiation: !type:VerbInitiation
            key: mark
            text: "Leave a mark (Offset)"
          results:
            - !type:SpawnItemResult
              spawnItem: SheetSteel1
              destination: { mode: Offset, offset: "0, 1" }    # <-- QlippothDestination (Vector2 must be quoted inside { })
        # USAGE EXAMPLE (mode NearestWithComponent + component): jump next to the closest Q-Gate on the map. Fails (chain stops) if there is none.
        - !type:QlippothAction
          actionName: exampleDestinationGate
          initiation: !type:VerbInitiation
            key: toGate
            text: "Go to the gate (NearestWithComponent)"
          results:
            - !type:TeleportResult
              targeting: { mode: Self }
              destination: { mode: NearestWithComponent, component: QGate }   # <-- QlippothDestination
            - !type:PopupResult
              message: "The doorway is gone."
              recipient: Actor
        # USAGE EXAMPLE (mode RandomOnGrid on a trigger): when hurt it relocates anywhere on its own grid.
        - !type:QlippothAction
          actionName: exampleDestinationFlee
          initiation: !type:OnDamagedInitiation
            minDelta: 5
          cooldown: 10
          results:
            - !type:DebugAnnounceResult
              note: "(proximity test)"
            - !type:TeleportResult
              targeting: { mode: Self }
              destination: { mode: RandomOnGrid }              # <-- QlippothDestination
        # USAGE EXAMPLE (targeting + destination together): every player within 6 tiles is dragged onto the tile of the Qlippoth.
        - !type:QlippothAction
          actionName: exampleDestinationDragIn
          initiation: !type:VerbInitiation
            key: dragIn
            text: "Drag everyone in (Self)"
          cooldown: 10
          results:
            - !type:TeleportResult
              targeting: { mode: InRange, range: 6, filter: { onlyPlayers: true } }
              destination: { mode: Self }                      # <-- QlippothDestination
              scatter: 1
#endregion





