  components: # this needs to be remade after all the systems are in place.
    - type: Qlippoth
      gatePhases: []   # admin-spawn only, never comes through a gate
    - type: Sprite
      sprite: Qlippoth/king_in_yellow.rsi
      layers:
        - state: front
    - type: QlippothActions
      actions:
        - !type:QlippothAction
          actionName: "templatePullSound"
          initiation: !type:OnPullInitiation
          results:
            - !type:PlaySoundResult
              soundPath: /Audio/Qlippoth/qlippoth.ogg
              volume: 5
    - type: QlippothMovement
      movementType: Animated
    - type: QlippothPresence
      presenceType: Object
      objectSize: Huge
    - type: Item
      size: Small
    - type: Animateable
    - type: Clickable
    - type: InteractionOutline
    - type: MovedByPressure
    - type: EmitSoundOnCollide
