#region itemQlippoths
# ITEM INSTANCES #
# Concrete, test-scale hand-held Qlippoths. Resolution / domain / aspect logic comes later.
- type: entity
  id: QlippothGazeScepter
  parent: QlippothItemBase
  name: scepter of gaze
  description: A shapeless branch with a lantern set into its middle. The light inside is looking for something.
  components:
    - type: Qlippoth
      gatePhases: [Phase1Rift]
      marketPrice: 500
      researchPoints: 50
      dungeon: !type:ArenaDungeon
        width: 20
        height: 15
    - type: QlippothPresence
      presenceType: Object
      objectSize: HandSized
    - type: QlippothMovement
      movementType: Inanimate
    # Behaviour is plain actions: pick up -> lantern wakes; held -> keeps re-aiming; Seek button -> re-aim + sanity cost.
    # Target priority: ContainmentPortal (exit while inside a domain), then QGate (nearest gate on the station).
    - type: QlippothActions
      actions:
        - !type:QlippothAction
          actionName: lanternWakes
          initiation: !type:OnPickedUpInitiation
          results:
            - !type:SetPinpointerActiveResult
              active: true
            - !type:PointAtNearestResult
              targetComponents: [ContainmentPortal, QGate]
        - !type:QlippothAction
          actionName: lanternSleeps
          initiation: !type:OnDroppedInitiation
          results:
            - !type:SetPinpointerActiveResult
              active: false
        - !type:QlippothAction
          actionName: lanternFollows   # catches gates/portals that appear after pickup
          initiation: !type:IntervalInitiation
            interval: 2
            onlyWhileHeld: true
          results:
            - !type:PointAtNearestResult
              targetComponents: [ContainmentPortal, QGate]
        - !type:QlippothAction
          actionName: seek
          initiation: !type:OnActionInitiation
            key: seek
          results:
            - !type:PointAtNearestResult   # fails (stops the chain) when nothing is found
              targetComponents: [ContainmentPortal, QGate]
              foundMessage: qlippoth-gaze-seek
              noTargetMessage: qlippoth-gaze-no-target
            - !type:PlaySoundResult
              soundPath: /Audio/Qlippoth/qlippoth.ogg
            # - !type:DamageSanityResult   # target = the holder
            #   amount: 5
    - type: Transform
      noRot: true # keep the arrow overlay readable, same as the stock pinpointer
    - type: Sprite
      noRot: true
      layers:
        - sprite: Qlippoth/gaze_scepter.rsi
          state: icon
          map: ["enum.PinpointerLayers.Base"]
        - sprite: Objects/Devices/pinpointer.rsi   # borrowed arrow overlay; swap for your own later
          state: pinonnull
          map: ["enum.PinpointerLayers.Screen"]
          shader: unshaded
          scale: 2, 2   # stock arrow is tiny; enlarge until we have our own
          visible: false
    - type: Item
      size: Normal
    - type: Pinpointer
      canRetarget: false
      reachedDistance: 1.5
      closeDistance: 6
      mediumDistance: 14
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.PinpointerVisuals.IsActive:
          enum.PinpointerLayers.Screen:
            True: { visible: true }
            False: { visible: false }
        enum.PinpointerVisuals.TargetDistance:
          enum.PinpointerLayers.Screen:
            Unknown: { state: pinonnull }
            Reached: { state: pinondirect }
            Close: { state: pinonclose }
            Medium: { state: pinonmedium }
            Far: { state: pinonfar }
    - type: ActionGrant          # creates the action entities on the item
      actions:
        - ActionQlippothGazeSeek
    - type: ItemActionGrant      # hands them to whoever is holding it
      actions:
        - ActionQlippothGazeSeek
    - type: PointLight
      radius: 3
      energy: 1.5
      color: "#FFD54A"

- type: entity
  id: QlippothEdgeSword
  parent: QlippothItemBase
  name: sword of edge
  description: An elegant blade that seems to shift its weight toward whoever is holding it.
  components:
    - type: Qlippoth
      gatePhases: [Phase2Verge]
      marketPrice: 1000
      researchPoints: 100
      dungeon: !type:ArenaDungeon
        width: 24
        height: 18
    - type: QlippothPresence
      presenceType: Object
      objectSize: HandSized
    - type: QlippothMovement
      movementType: Inanimate # becomes Animated/Specialist once it flies on its own
    # Stance lives in the state dictionary; the two stance actions gate on it with requireState.
    - type: QlippothActions
      state:
        stance: defensive
      actions:
        - !type:QlippothAction
          actionName: takenUp
          initiation: !type:OnPickedUpInitiation
          results:
            - !type:PopupResult
              message: qlippoth-edge-taken
        - !type:QlippothAction
          actionName: toOffensive
          initiation: !type:OnActionInitiation
            key: stance
          requireState: { stance: defensive }
          results:
            - !type:SetStateResult
              key: stance
              value: offensive
            - !type:PopupResult
              message: qlippoth-edge-stance-offensive
        - !type:QlippothAction
          actionName: toDefensive
          initiation: !type:OnActionInitiation
            key: stance
          requireState: { stance: offensive }
          results:
            - !type:SetStateResult
              key: stance
              value: defensive
            - !type:PopupResult
              message: qlippoth-edge-stance-defensive
        - !type:QlippothAction
          actionName: parry   # defensive: negate the next external hit on the holder
          initiation: !type:OnHolderDamagedInitiation
          requireState: { stance: defensive }
          cooldown: 6
          results:
            - !type:NegateDamageResult
            - !type:PlaySoundResult
              soundPath: /Audio/Weapons/block_metal1.ogg
            - !type:PopupResult
              message: qlippoth-edge-parry
              recipient: Everyone
              type: Medium
        - !type:QlippothAction
          actionName: echo    # offensive: bonus damage on hit
          initiation: !type:OnMeleeHitInitiation
          requireState: { stance: offensive }
          cooldown: 2.5
          results:
            - !type:BonusMeleeDamageResult
              damage:
                types:
                  Slash: 10
            - !type:PlaySoundResult
              soundPath: /Audio/Weapons/bladeslice.ogg
            - !type:PopupResult
              message: qlippoth-edge-repeat
              recipient: Actor
    - type: Sprite
      layers:
        - sprite: Qlippoth/edge_sword.rsi
          state: icon
    - type: Item
      size: Normal
    - type: MeleeWeapon
      attackRate: 1.3
      wideAnimationRotation: 180 # sprite is drawn tip-up; 0 would point the tip at the attacker
      damage:
        types:
          Slash: 14
      soundHit:
        path: /Audio/Weapons/bladeslice.ogg
    - type: ActionGrant
      actions:
        - ActionQlippothEdgeSwordStance
    - type: ItemActionGrant
      actions:
        - ActionQlippothEdgeSwordStance
    - type: PointLight
      radius: 2
      energy: 1
      color: "#C0E8FF"

- type: entity
  id: QlippothKey
  parent: QlippothItemBase
  name: key of thresholds
  description: A key with no teeth. Every door seems to remember it anyway.
  components:
    - type: Qlippoth
      gatePhases: [Phase3Eclipse]
      marketPrice: 2000
      researchPoints: 150
      dungeon: !type:ArenaDungeon
        width: 28
        height: 21
    - type: QlippothPresence
      presenceType: Object
      objectSize: HandSized
    - type: QlippothMovement
      movementType: Inanimate
    - type: QlippothActions
      actions:
        - !type:QlippothAction
          actionName: unlock   # click a door with the key: open it regardless of access
          initiation: !type:OnUsedOnInitiation
            requiredComponent: Door
          results:
            - !type:OpenDoorResult   # fails on welded doors, which stops the sound + popup below
              failMessage: qlippoth-key-welded
            - !type:PlaySoundResult
              soundPath: /Audio/Machines/airlock_open.ogg
            - !type:PopupResult
              message: qlippoth-key-unlock
              recipient: Actor
        - !type:QlippothAction
          actionName: seal
          initiation: !type:OnActionInitiation
            key: seal
          results:
            - !type:HoldDoorsInRangeResult
              mode: Sealed
              range: 7
              duration: 15
              message: qlippoth-key-seal
            - !type:PlaySoundResult
              soundPath: /Audio/Machines/boltsdown.ogg
        - !type:QlippothAction
          actionName: release
          initiation: !type:OnActionInitiation
            key: release
          results:
            - !type:HoldDoorsInRangeResult
              mode: Released
              range: 7
              duration: 15
              message: qlippoth-key-release
            - !type:PlaySoundResult
              soundPath: /Audio/Machines/boltsup.ogg
    - type: Sprite
      layers:
        - sprite: Qlippoth/key.rsi
          state: icon
    - type: Item
      size: Small
    - type: ActionGrant
      actions:
        - ActionQlippothKeySeal
        - ActionQlippothKeyRelease
    - type: ItemActionGrant
      actions:
        - ActionQlippothKeySeal
        - ActionQlippothKeyRelease
    - type: PointLight
      radius: 2
      energy: 1
      color: "#B08CFF"
#endregion

