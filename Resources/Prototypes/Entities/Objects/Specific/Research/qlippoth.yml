- type: entity
  parent: BaseItem
  id: QlippothBreachSealDevice
  name: Qlippoth breach seal device
  description: A Science-built device intended to seal a breached Q-Gate rift.
  components:
  - type: Sprite
    sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
    state: icon
  - type: Item
    size: Small
  - type: QlippothBreachSealDevice
    sealDuration: 5

# Q-Gear is issued by an individual's terminal research checkpoint rather than unlocked in
# the station technology database. Species prototypes select one of these dedicated designs.
- type: entity
  parent: BaseItem
  id: QlippothQGearResonanceProbe
  name: Q-Gear resonance probe
  description: A specimen-tuned probe that scans a Qlippoth's resonance profile and compatible Q-Gate phases.
  components:
  - type: Sprite
    sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
    state: icon
  - type: Item
    size: Small
  - type: QlippothQGear
    gearType: ResonanceProbe

- type: entity
  parent: BaseItem
  id: QlippothQGearInversionTongs
  name: Q-Gear inversion tongs
  description: Specimen-tuned tongs that can suppress active Qlippoth corruption on a reachable target.
  components:
  - type: Sprite
    sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
    state: icon
  - type: Item
    size: Small
  - type: QlippothQGear
    gearType: InversionTongs

- type: entity
  parent: BaseItem
  id: QlippothQGearBoundaryAnchor
  name: Q-Gear boundary anchor
  description: Temporarily anchors a breached containment field, suppressing escape and cross-field corruption for 30 seconds.
  components:
  - type: Sprite
    sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
    state: icon
  - type: Item
    size: Small
  - type: QlippothQGear
    gearType: BoundaryAnchor
    cooldownSeconds: 60

- type: entity
  parent: BaseItem
  id: QlippothQGearGateCompass
  name: Q-Gear gate compass
  description: Reads the phase, status, and distance of a reachable Q-Gate within 20 meters.
  components:
  - type: Sprite
    sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
    state: icon
  - type: Item
    size: Small
  - type: QlippothQGear
    gearType: GateCompass

- type: entity
  parent: BaseItem
  id: QlippothQGearHorizonLens
  name: Q-Gear horizon lens
  description: Reveals the severity, remaining duration, and source attribution of active Qlippoth corruption.
  components:
  - type: Sprite
    sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
    state: icon
  - type: Item
    size: Small
  - type: QlippothQGear
    gearType: HorizonLens

- type: entity
  parent: BaseBlueprint
  id: BlueprintContainmentChamber
  name: containment chamber blueprint
  description: A Science-approved blueprint for a Qlippoth containment chamber construction kit.
  components:
  - type: Sprite
    sprite: Objects/Tools/blueprint.rsi
    state: icon
  - type: Item
    size: Normal
  - type: QlippothChamberConstructionKit
  - type: Blueprint
    providedRecipes:
    - ContainmentChamberConstructionKit

- type: entity
  parent: BaseItem
  id: ContainmentChamberConstructionKit
  name: containment chamber construction kit
  description: A construction kit produced from a containment chamber blueprint.
  components:
  - type: Sprite
    sprite: Objects/Tools/blueprint.rsi
    state: icon
  - type: Item
    size: Normal
  - type: QlippothChamberConstructionKit
