- type: entity
  id: qlippothPrototype
  name: Qlippoth
  components: # most of these components are copy pasted from BaseItem, because parent structure is not fully defined yet.
    - type: Sprite
      sprite: Qlippoth/king_in_yellow.rsi
      state: front
    - type: QlippothActions
      actions:
        - !type:QlippothAction
          initiation: !type:OnPullInitiation
          results:
            - !type:PlaySoundResult
              soundPath: /Audio/Qlippoth/qlippoth.ogg
              volume: 5
    - type: QlippothMovement
      movementType: Animated
    - type: QlippothPresence
      presenceType: Curse
      objectSize: Medium
    - type: Item
      size: Small
    - type: Animateable
    - type: Clickable
    - type: InteractionOutline
    - type: MovedByPressure
    - type: EmitSoundOnCollide
      sound:
        collection: WeakHit
    - type: EmitSoundOnLand
      sound:
        path: /Audio/Effects/drop.ogg
        params:
          volume: 2
    - type: Physics
      bodyType: Dynamic
      fixedRotation: false
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.25,-0.25,0.25,0.25"
          density: 20
          mask:
          - ItemMask
          restitution: 0.3
          friction: 0.2
    - type: Pullable
    - type: DamageExaminable
